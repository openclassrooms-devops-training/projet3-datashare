name: CI Frontend

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng lint

  test:
    name: Tests unitaires (Jest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e:
    name: Tests e2e (Cypress)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datashare
          POSTGRES_USER: datashare
          POSTGRES_PASSWORD: datashare_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__DataShare: "Host=localhost;Port=5432;Database=datashare;Username=datashare;Password=datashare_dev_only"
      Jwt__Key: "ci-e2e-signing-key-at-least-32-characters-long"
      fileStorage__path: "/tmp/datashare-e2e-storage"
      App__BaseUrl: "http://localhost:4200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check for e2e specs
        id: e2e-check
        working-directory: frontend
        run: |
          if [ -z "$(find cypress/e2e -name '*.cy.ts' 2>/dev/null)" ]; then
            echo "Aucun test e2e pour l'instant (pas encore de fonctionnalité à tester) — étape ignorée."
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
          fi
      # Les scenarios Cypress appellent une vraie API (pas de mock) : il faut demarrer
      # le vrai backend .NET contre la vraie base Postgres du job, migrations comprises.
      - uses: actions/setup-dotnet@v4
        if: steps.e2e-check.outputs.has_specs == 'true'
        with:
          dotnet-version: "8.0.x"
      - name: Apply database migrations
        if: steps.e2e-check.outputs.has_specs == 'true'
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project src/DataShare.Api
      - name: Start backend
        if: steps.e2e-check.outputs.has_specs == 'true'
        working-directory: backend
        run: |
          dotnet run --project src/DataShare.Api --urls http://localhost:5074 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5074/health > /dev/null; then
              echo "Backend pret"
              exit 0
            fi
            sleep 2
          done
          echo "Le backend n'a pas demarre a temps"
          exit 1
      - run: npm run e2e:ci
        if: steps.e2e-check.outputs.has_specs == 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots/
            frontend/cypress/videos/

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    # Cohérence avec le backend : SonarQube Community Edition ne supporte pas
    # l'analyse de Pull Request, on analyse seulement au push (donc au merge).
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
