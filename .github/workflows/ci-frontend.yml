name: CI Frontend

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng lint

  test:
    name: Tests unitaires (Jest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e:
    name: Tests e2e (Cypress)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check for e2e specs
        id: e2e-check
        working-directory: frontend
        run: |
          if [ -z "$(find cypress/e2e -name '*.cy.ts' 2>/dev/null)" ]; then
            echo "Aucun test e2e pour l'instant (pas encore de fonctionnalité à tester) — étape ignorée."
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run e2e:ci
        if: steps.e2e-check.outputs.has_specs == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots/
            frontend/cypress/videos/

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    # Cohérence avec le backend : SonarQube Community Edition ne supporte pas
    # l'analyse de Pull Request, on analyse seulement au push (donc au merge).
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
