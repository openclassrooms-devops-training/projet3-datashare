name: CI Backend

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datashare
          POSTGRES_USER: datashare
          POSTGRES_PASSWORD: datashare_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Base dediee aux tests d'integration (DataShare.IntegrationTests) - distincte
      # de la base "datashare", cf. backend/README.md pour l'equivalent en local.
      - name: Create integration test database
        run: PGPASSWORD=datashare_dev_only psql -h localhost -U datashare -d datashare -c "CREATE DATABASE datashare_integration_test;"
      - run: dotnet restore
      - run: dotnet test --no-restore --collect:"XPlat Code Coverage" --results-directory ./coverage
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    # SonarQube Community Edition ne supporte pas l'analyse de Pull Request
    # (fonctionnalité payante) — on analyse seulement au push (donc au merge).
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Begin SonarQube Analysis
        run: dotnet sonarscanner begin /k:"${{ github.repository_owner }}_${{ github.event.repository.name }}_backend" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.cs.cobertura.reportsPaths="coverage/**/coverage.cobertura.xml"
      - run: dotnet restore
      - run: dotnet build --no-restore
      - name: End SonarQube Analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish --configuration Release --output ./publish
      - uses: actions/upload-artifact@v7
        with:
          name: backend-publish
          path: backend/publish/
